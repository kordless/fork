[package]
name = "grubcrawler"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Grubcrawler — the starting crawler for the Fork internet. Fetches, extracts, and queues real-web content into the fork."

[dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "gzip", "brotli", "deflate", "rustls-tls"], default-features = false }
scraper = "0.20"
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
dashmap = "5"
futures = "0.3"
bytes = "1"
